name: Build ENet-CSharp

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - linux
          - windows
          - macos
          - android
          - ios

jobs:

  build-linux:
    name: Native - Linux (x64)
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'linux' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install CMake
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential

      - name: Configure and build
        run: |
          cmake -S Source/Native -B build-linux \
            -DCMAKE_BUILD_TYPE=Release \
            -DENET_SHARED=true
          cmake --build build-linux --config Release

      - name: Verify output
        run: |
          echo "=== Linux outputs ==="
          find build-linux -type f | sort
          test -n "$(find build-linux -name "*.so" -print -quit)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: enet-linux-x64
          path: build-linux/*.so
          if-no-files-found: error

  build-windows:
    name: Native - Windows (x64)
    runs-on: windows-latest
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'windows' }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure and build
        shell: pwsh
        run: |
          cmake -S Source/Native -B build-windows -A x64 `
            -DENET_SHARED=true
          cmake --build build-windows --config Release

      - name: Verify output
        shell: pwsh
        run: |
          Write-Host "=== Windows outputs ==="
          Get-ChildItem -Recurse build-windows | ForEach-Object { $_.FullName }
          $dll = Get-ChildItem -Recurse build-windows -Filter *.dll | Select-Object -First 1
          if (-not $dll) { throw "No DLL produced." }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: enet-windows-x64
          path: build-windows/Release/*.dll
          if-no-files-found: error

  build-macos:
    name: Native - macOS (universal)
    runs-on: macos-latest
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'macos' }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure and build
        run: |
          cmake -S Source/Native -B build-macos \
            -DCMAKE_BUILD_TYPE=Release \
            -DENET_SHARED=true
          cmake --build build-macos --config Release

      - name: Verify universal binary
        run: |
          echo "=== macOS outputs ==="
          find build-macos -type f | sort
          DYLIB=$(find build-macos -name "*.dylib" -print -quit)
          test -n "$DYLIB"
          ARCHS=$(lipo -archs "$DYLIB")
          echo "Architectures: $ARCHS"
          case "$ARCHS" in
            *x86_64*arm64*|*arm64*x86_64*) echo "Universal binary confirmed" ;;
            *) echo "Dylib is not universal (need arm64 + x86_64)"; exit 1 ;;
          esac

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: enet-macos-universal
          path: build-macos/*.dylib
          if-no-files-found: error

  build-android:
    name: Native - Android
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'android' }}
    steps:
      - uses: actions/checkout@v4

      # The runner image ships the Android SDK; android-actions/setup-android@v3 now fails installing the
      # retired SDK 'tools' package, so install the NDK with the image's own sdkmanager instead
      - name: Install NDK r28c
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMANAGER=$(ls -d "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -n 1)
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "ndk;28.2.13676358" > /dev/null
          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/28.2.13676358" >> "$GITHUB_ENV"
          test -x "$SDK_ROOT/ndk/28.2.13676358/ndk-build"

      - name: Build with ndk-build
        run: |
          "$ANDROID_NDK_HOME/ndk-build" \
            -C Source/Native \
            NDK_PROJECT_PATH=. \
            NDK_APPLICATION_MK=jni/Application.mk \
            NDK_LIBS_OUT=libs \
            NDK_OUT=obj \
            V=1

      - name: Collect unstripped .so files from obj/local
        run: |
          mkdir -p android-out/arm64-v8a android-out/armeabi-v7a android-out/x86_64
          cp Source/Native/obj/local/arm64-v8a/libenet.so   android-out/arm64-v8a/libenet.so
          cp Source/Native/obj/local/armeabi-v7a/libenet.so android-out/armeabi-v7a/libenet.so
          cp Source/Native/obj/local/x86_64/libenet.so      android-out/x86_64/libenet.so
          find android-out -name "*.so" | xargs ls -lh

      - name: Verify 16KB page alignment
        run: |
          LLVM_READELF="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          find android-out -name "*.so" | while read -r f; do
            echo ""
            echo "File: $f"
            "$LLVM_READELF" --program-headers "$f" | grep -E "LOAD|Align" || true
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: enet-android
          path: android-out/
          if-no-files-found: error

  build-ios:
    name: Native - iOS + visionOS + visionOS Simulator
    runs-on: macos-latest
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'ios' }}
    steps:
      - uses: actions/checkout@v4

      - name: Build with build-ios.sh
        run: |
          cd Source/Native
          sh build-ios.sh

      - name: Verify all outputs
        run: |
          echo "=== All outputs from build-ios.sh ==="
          find Source/Native/build -type f | sort
          test -f Source/Native/build/ios/libenet.a
          test -f Source/Native/build/visionos/libenet.a
          test -f Source/Native/build/visionos-sim/libenet.a

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: enet-ios
          path: Source/Native/build/ios/libenet.a
          if-no-files-found: error

      - name: Upload visionOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: enet-visionos
          path: Source/Native/build/visionos/libenet.a
          if-no-files-found: error

      - name: Upload visionOS Simulator artifact
        uses: actions/upload-artifact@v4
        with:
          name: enet-visionos-simulator
          path: Source/Native/build/visionos-sim/libenet.a
          if-no-files-found: error

  build-csharp:
    name: Managed C# Assembly
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platform == 'all' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build C# project
        run: dotnet build Source/Managed/ENet-CSharp.csproj -c Release

      - name: Verify output
        run: |
          echo "=== Managed outputs ==="
          find Source/Managed/bin/Release -type f | sort
          test -f Source/Managed/bin/Release/netstandard2.1/ENet-CSharp.dll
          test -f Source/Managed/bin/Release/net10.0/ENet-CSharp.dll

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: enet-csharp-assembly
          path: Source/Managed/bin/Release/**/*.dll
          if-no-files-found: error

  test-linux:
    name: Test - Linux
    needs: build-linux
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'linux' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Download native library
        uses: actions/download-artifact@v4
        with:
          name: enet-linux-x64
          path: native-lib

      - name: Run tests against the shipped binary
        env:
          ENET_NATIVE_LIB_DIR: ${{ github.workspace }}/native-lib
          ENET_EXPECT_POOL: '1'
        run: dotnet test Source/Managed.Tests/ENet-CSharp.Tests.csproj -c Release --logger "console;verbosity=normal"

  test-windows:
    name: Test - Windows
    needs: build-windows
    runs-on: windows-latest
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'windows' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Download native library
        uses: actions/download-artifact@v4
        with:
          name: enet-windows-x64
          path: native-lib

      - name: Run tests against the shipped binary
        env:
          ENET_NATIVE_LIB_DIR: ${{ github.workspace }}\native-lib
          ENET_EXPECT_POOL: '1'
        run: dotnet test Source/Managed.Tests/ENet-CSharp.Tests.csproj -c Release --logger "console;verbosity=normal"

  test-macos:
    name: Test - macOS
    needs: build-macos
    runs-on: macos-latest
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'macos' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Download native library
        uses: actions/download-artifact@v4
        with:
          name: enet-macos-universal
          path: native-lib

      - name: Run tests against the shipped binary
        env:
          ENET_NATIVE_LIB_DIR: ${{ github.workspace }}/native-lib
          ENET_EXPECT_POOL: '1'
        run: dotnet test Source/Managed.Tests/ENet-CSharp.Tests.csproj -c Release --logger "console;verbosity=normal"

  test-linux-nopool:
    name: Test - Linux (ENET_NO_POOL)
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'linux' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build the no-pool native library
        run: |
          cmake -S Source/Native -B build-nopool -DCMAKE_BUILD_TYPE=Release -DENET_SHARED=true -DENET_NO_POOL=true
          cmake --build build-nopool --config Release

      - name: Run tests against the no-pool build
        env:
          ENET_NATIVE_LIB_PATH: ${{ github.workspace }}/build-nopool/libenet.so
          ENET_EXPECT_POOL: '0'
        run: dotnet test Source/Managed.Tests/ENet-CSharp.Tests.csproj -c Release --logger "console;verbosity=normal"

  sanitize-linux:
    name: Sanitizers - Linux (TSan, ASan)
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'linux' }}
    steps:
      - uses: actions/checkout@v4

      # ThreadSanitizer cannot map its shadow memory with the default ASLR entropy on recent kernels
      - name: Lower mmap randomization for ThreadSanitizer
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: ThreadSanitizer stress (pool, 4 phases)
        run: |
          gcc -O1 -g -fsanitize=thread -fPIC -shared -o libenet_tsan.so Source/Native/enet.c -lpthread
          gcc -O1 -g -fsanitize=thread -o pool_stress_tsan Source/Native/bench/pool_stress.c -ldl -lpthread
          TSAN_OPTIONS="halt_on_error=1" ./pool_stress_tsan ./libenet_tsan.so 5

      - name: AddressSanitizer + LeakSanitizer stress (pool and ENET_NO_POOL)
        run: |
          gcc -O1 -g -fsanitize=address -fno-omit-frame-pointer -o pool_stress_asan Source/Native/bench/pool_stress.c -ldl -lpthread
          gcc -O1 -g -fsanitize=address -fno-omit-frame-pointer -fPIC -shared -o libenet_asan.so Source/Native/enet.c -lpthread
          gcc -O1 -g -DENET_NO_POOL -fsanitize=address -fno-omit-frame-pointer -fPIC -shared -o libenet_asan_nopool.so Source/Native/enet.c -lpthread
          ASAN_OPTIONS="detect_leaks=1" ./pool_stress_asan ./libenet_asan.so 5
          ASAN_OPTIONS="detect_leaks=1" ./pool_stress_asan ./libenet_asan_nopool.so 5

  pack:
    name: Pack NuGet Package
    needs:
      - build-csharp
      - test-linux
      - test-windows
      - test-macos
      - test-linux-nopool
      - sanitize-linux
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platform == 'all' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Verify tag matches project version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=$(grep -oPm1 '(?<=<Version>)[^<]+' Source/Managed/ENet-CSharp.csproj)
          TAG="${GITHUB_REF_NAME#v}"
          echo "csproj version: $VERSION, tag: $TAG"
          if [ "$VERSION" != "$TAG" ]; then
            echo "Tag v$TAG does not match <Version>$VERSION</Version> in the csproj"
            exit 1
          fi

      - name: Download native artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Stage native runtimes
        run: |
          mkdir -p Source/Managed/runtimes/win-x64/native
          mkdir -p Source/Managed/runtimes/linux-x64/native
          mkdir -p Source/Managed/runtimes/osx/native
          cp artifacts/enet-windows-x64/enet.dll        Source/Managed/runtimes/win-x64/native/
          cp artifacts/enet-linux-x64/libenet.so        Source/Managed/runtimes/linux-x64/native/
          cp artifacts/enet-macos-universal/libenet.dylib Source/Managed/runtimes/osx/native/
          find Source/Managed/runtimes -type f | xargs ls -lh

      - name: Pack
        run: dotnet pack Source/Managed/ENet-CSharp.csproj -c Release -o nupkg

      - name: Inspect package
        run: |
          ls -lh nupkg/
          unzip -l nupkg/*.nupkg

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: nupkg/*.nupkg
          if-no-files-found: error

  publish:
    name: Publish to NuGet.org
    needs: pack
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      id-token: write     # mint the OIDC token for NuGet Trusted Publishing
      contents: read
    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          name: nuget-package
          path: nupkg

      - name: NuGet login (Trusted Publishing / OIDC)
        uses: NuGet/login@v1
        id: login
        with:
          user: lupinlll

      - name: Push to NuGet.org
        run: |
          dotnet nuget push "nupkg/*.nupkg" \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source "https://api.nuget.org/v3/index.json" \
            --skip-duplicate

  package:
    name: Bundle All Artifacts
    needs:
      - build-linux
      - build-windows
      - build-macos
      - build-android
      - build-ios
      - build-csharp
      - test-linux
      - test-windows
      - test-macos
      - test-linux-nopool
      - sanitize-linux
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platform == 'all' }}
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Verify bundle contents
        run: |
          echo "=== All bundled files ==="
          find artifacts -type f | sort | xargs ls -lh

      - name: Upload combined bundle
        uses: actions/upload-artifact@v4
        with:
          name: enet-all-platforms
          path: artifacts/
          if-no-files-found: error